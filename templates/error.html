<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} Error — TRUSTMESH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <header class="app-header">
        <div class="header-container">
            <div class="brand-group">
                <a href="{{ url_for('index') }}" class="brand-link">
                    <div class="brand-logo" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            <path d="M9 12l2 2 4-4"/>
                        </svg>
                    </div>
                    <div class="brand-meta">
                        <span class="brand-name">TRUSTMESH</span>
                    </div>
                </a>
            </div>
            <div class="header-nav">
                <a href="{{ url_for('index') }}" class="nav-link">Return Home</a>
            </div>
        </div>
    </header>

    <main class="main-container auth-container">
        <div class="auth-card text-center">
            <div class="error-code-badge">{{ code }}</div>
            <h2 class="auth-title">{{ message or 'An error occurred.' }}</h2>
            <p class="auth-subtitle">Please verify your permissions or navigation path.</p>
            <div class="mt-4">
                <a href="{{ url_for('index') }}" class="primary-btn inline-btn">Back to Safety</a>
                {% if not is_authenticated %}
                <a href="{{ url_for('login') }}" class="secondary-btn inline-btn">Sign In</a>
                {% endif %}
            </div>
        </div>
    </main>
</body>
</html>
