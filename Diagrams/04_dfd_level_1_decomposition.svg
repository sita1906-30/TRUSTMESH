<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #070B14; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
    
    <defs>
        <!-- Arrowhead Marker (Cyan) -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
        </marker>
        <!-- Arrowhead Marker (Green) -->
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#00F090"/>
        </marker>
        <!-- Arrowhead Marker (Purple) -->
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8"/>
        </marker>
        <!-- Arrowhead Marker (Amber) -->
        <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
        </marker>
        <!-- Card Drop Shadow -->
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
        </filter>
        <!-- Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background Canvas -->
    <rect width="1200" height="900" fill="#070B14"/>
    <rect x="15" y="15" width="1170" height="870" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Title Block -->
    <text x="600" y="48" text-anchor="middle" fill="#00F090" font-size="24" font-weight="700" letter-spacing="1">TRUSTMESH — DATA FLOW DIAGRAM (LEVEL 1)</text>
    <text x="600" y="72" text-anchor="middle" fill="#94A3B8" font-size="13">Subsystem Decomposition, Internal Processes, and Data Store Interactions</text>

    <!-- ==================== PROCESSES (ROUNDED RECTS) ==================== -->
    <!-- Process 1.0: Auth & Security -->
    <g transform="translate(50, 120)">
        <rect width="260" height="80" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="15" y="25" fill="#38BDF8" font-size="11" font-weight="700">1.0 AUTH &amp; ACCESS CONTROL</text>
        <text x="15" y="45" fill="#F8FAFC" font-size="12" font-weight="600">Password Salting, RBAC &amp;</text>
        <text x="15" y="63" fill="#F8FAFC" font-size="12" font-weight="600">Session Fixation Defense</text>
    </g>

    <!-- Process 2.0: Heuristic Analyzer -->
    <g transform="translate(470, 120)">
        <rect width="260" height="80" rx="10" fill="#0F172A" stroke="#00F090" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="15" y="25" fill="#00F090" font-size="11" font-weight="700">2.0 THREAT HEURISTIC ENGINE</text>
        <text x="15" y="45" fill="#F8FAFC" font-size="12" font-weight="600">Regex Heuristics, URL Parsing,</text>
        <text x="15" y="63" fill="#F8FAFC" font-size="12" font-weight="600">Risk Score &amp; Tier Classification</text>
    </g>

    <!-- Process 3.0: Transactional Persistence -->
    <g transform="translate(890, 120)">
        <rect width="260" height="80" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="15" y="25" fill="#10B981" font-size="11" font-weight="700">3.0 PERSISTENCE CONTROLLER</text>
        <text x="15" y="45" fill="#F8FAFC" font-size="12" font-weight="600">SHA-256 Fingerprint, Atomicity</text>
        <text x="15" y="63" fill="#F8FAFC" font-size="12" font-weight="600">&amp; Dual-Dialect Persistence</text>
    </g>

    <!-- Process 4.0: Audit Logging -->
    <g transform="translate(50, 480)">
        <rect width="260" height="80" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="15" y="25" fill="#EF4444" font-size="11" font-weight="700">4.0 AUDIT LOGGING MANAGER</text>
        <text x="15" y="45" fill="#F8FAFC" font-size="12" font-weight="600">Security Event Telemetry,</text>
        <text x="15" y="63" fill="#F8FAFC" font-size="12" font-weight="600">Access Violations &amp; Login Trails</text>
    </g>

    <!-- Process 5.0: Report & Storage -->
    <g transform="translate(470, 480)">
        <rect width="260" height="80" rx="10" fill="#0F172A" stroke="#818CF8" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="15" y="25" fill="#818CF8" font-size="11" font-weight="700">5.0 REPORT EXPORT SERVICE</text>
        <text x="15" y="45" fill="#F8FAFC" font-size="12" font-weight="600">Forensic JSON Report Archival,</text>
        <text x="15" y="63" fill="#F8FAFC" font-size="12" font-weight="600">Azure Blob &amp; Local Fallback</text>
    </g>

    <!-- Process 6.0: Analytics Pipeline -->
    <g transform="translate(890, 480)">
        <rect width="260" height="80" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="15" y="25" fill="#F59E0B" font-size="11" font-weight="700">6.0 BI ANALYTICS PIPELINE</text>
        <text x="15" y="45" fill="#F8FAFC" font-size="12" font-weight="600">SQL View Aggregation, Zero-PII</text>
        <text x="15" y="63" fill="#F8FAFC" font-size="12" font-weight="600">Scrubbing &amp; Power BI CSV</text>
    </g>

    <!-- ==================== DATA STORES (OPEN-ENDED BOXES) ==================== -->
    <!-- D1: USERS & ROLES -->
    <g transform="translate(50, 300)">
        <path d="M 0 0 L 260 0 M 0 60 L 260 60" stroke="#38BDF8" stroke-width="2"/>
        <rect x="0" y="0" width="260" height="60" fill="#1E293B" opacity="0.6"/>
        <text x="15" y="25" fill="#38BDF8" font-size="11" font-weight="700">D1: USERS &amp; ROLES</text>
        <text x="15" y="45" fill="#94A3B8" font-size="10">user_id, email, password_hash, role_id</text>
    </g>

    <!-- D2: INCIDENTS & RISK_SCORES -->
    <g transform="translate(890, 300)">
        <path d="M 0 0 L 260 0 M 0 60 L 260 60" stroke="#00F090" stroke-width="2"/>
        <rect x="0" y="0" width="260" height="60" fill="#1E293B" opacity="0.6"/>
        <text x="15" y="25" fill="#00F090" font-size="11" font-weight="700">D2: INCIDENTS &amp; RISK_SCORES</text>
        <text x="15" y="45" fill="#94A3B8" font-size="10">fingerprint, score, level, user_id</text>
    </g>

    <!-- D3: SIGNAL_TYPES -->
    <g transform="translate(470, 300)">
        <path d="M 0 0 L 260 0 M 0 60 L 260 60" stroke="#A7F3D0" stroke-width="2"/>
        <rect x="0" y="0" width="260" height="60" fill="#1E293B" opacity="0.6"/>
        <text x="15" y="25" fill="#A7F3D0" font-size="11" font-weight="700">D3: SIGNAL_TYPES &amp; SIGNALS</text>
        <text x="15" y="45" fill="#94A3B8" font-size="10">signal_code, weight, category, incident_id</text>
    </g>

    <!-- D4: AUDIT_LOGS -->
    <g transform="translate(50, 680)">
        <path d="M 0 0 L 260 0 M 0 60 L 260 60" stroke="#EF4444" stroke-width="2"/>
        <rect x="0" y="0" width="260" height="60" fill="#1E293B" opacity="0.6"/>
        <text x="15" y="25" fill="#EF4444" font-size="11" font-weight="700">D4: AUDIT_LOGS</text>
        <text x="15" y="45" fill="#94A3B8" font-size="10">audit_id, event_type, status, timestamp</text>
    </g>

    <!-- D5: EXPORTED_REPORTS -->
    <g transform="translate(470, 680)">
        <path d="M 0 0 L 260 0 M 0 60 L 260 60" stroke="#818CF8" stroke-width="2"/>
        <rect x="0" y="0" width="260" height="60" fill="#1E293B" opacity="0.6"/>
        <text x="15" y="25" fill="#818CF8" font-size="11" font-weight="700">D5: EXPORTED_REPORTS &amp; BLOBS</text>
        <text x="15" y="45" fill="#94A3B8" font-size="10">report_id, blob_url, local_path, status</text>
    </g>

    <!-- D6: ANALYTICAL VIEWS -->
    <g transform="translate(890, 680)">
        <path d="M 0 0 L 260 0 M 0 60 L 260 60" stroke="#F59E0B" stroke-width="2"/>
        <rect x="0" y="0" width="260" height="60" fill="#1E293B" opacity="0.6"/>
        <text x="15" y="25" fill="#F59E0B" font-size="11" font-weight="700">D6: ANALYTICAL VIEWS</text>
        <text x="15" y="45" fill="#94A3B8" font-size="10">v_analytics_overview, trends, distribution</text>
    </g>

    <!-- ==================== FLOW CONNECTIONS ==================== -->
    <!-- 1.0 -> D1 & D4 -->
    <line x1="180" y1="200" x2="180" y2="300" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="185" y="250" fill="#38BDF8" font-size="10">Query/Save User</text>

    <line x1="180" y1="560" x2="180" y2="680" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="185" y="620" fill="#EF4444" font-size="10">Log Security Events</text>

    <!-- 2.0 -> D3 -->
    <line x1="600" y1="200" x2="600" y2="300" stroke="#00F090" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="605" y="250" fill="#00F090" font-size="10">Fetch Signal Weights</text>

    <!-- 2.0 -> 3.0 -->
    <line x1="730" y1="160" x2="890" y2="160" stroke="#00F090" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="810" y="150" text-anchor="middle" fill="#00F090" font-size="10">Score &amp; Signals</text>

    <!-- 3.0 -> D2 -->
    <line x1="1020" y1="200" x2="1020" y2="300" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="1025" y="250" fill="#10B981" font-size="10">Atomic Insert</text>

    <!-- D2 -> 5.0 -->
    <line x1="950" y1="360" x2="600" y2="480" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <text x="760" y="420" fill="#818CF8" font-size="10">Fetch Incident Data</text>

    <!-- 5.0 -> D5 -->
    <line x1="600" y1="560" x2="600" y2="680" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <text x="605" y="620" fill="#818CF8" font-size="10">Record Export</text>

    <!-- D2 & D3 -> D6 -->
    <line x1="1020" y1="360" x2="1020" y2="680" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
    <text x="1025" y="520" fill="#F59E0B" font-size="10">SQL Aggregations</text>

    <!-- D6 -> 6.0 -->
    <line x1="1020" y1="680" x2="1020" y2="560" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
    <text x="960" y="620" fill="#F59E0B" font-size="10">Query Views</text>
</svg>