<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" width="100%" height="100%" style="background-color: #070B14; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
    
    <defs>
        <!-- Arrowhead Marker (Cyan) -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
        </marker>
        <!-- Arrowhead Marker (Green) -->
        <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#00F090"/>
        </marker>
        <!-- Arrowhead Marker (Purple) -->
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8"/>
        </marker>
        <!-- Arrowhead Marker (Amber) -->
        <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
        </marker>
        <!-- Card Drop Shadow -->
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
        </filter>
        <!-- Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background Canvas -->
    <rect width="1300" height="880" fill="#070B14"/>
    <rect x="15" y="15" width="1270" height="850" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Title Block -->
    <text x="650" y="50" text-anchor="middle" fill="#00F090" font-size="24" font-weight="700" letter-spacing="1">TRUSTMESH — SYSTEM ARCHITECTURE</text>
    <text x="650" y="74" text-anchor="middle" fill="#94A3B8" font-size="13">High-Level 4-Tier Layered Architecture with Dual-Mode Persistence &amp; Cloud Integration</text>

    <!-- ==================== TIER 1: CLIENT LAYER ==================== -->
    <g transform="translate(40, 100)">
        <rect width="1220" height="135" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="1220" height="28" rx="8" fill="#1E293B"/>
        <text x="16" y="19" fill="#38BDF8" font-size="12" font-weight="700">TIER 1: PRESENTATION &amp; CLIENT INTERFACE LAYER</text>

        <!-- Node 1: Guest User -->
        <rect x="25" y="42" width="260" height="75" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <circle cx="50" cy="80" r="14" fill="#334155"/>
        <text x="50" y="84" text-anchor="middle" fill="#94A3B8" font-size="13">&#128100;</text>
        <text x="75" y="70" fill="#F8FAFC" font-size="13" font-weight="600">Guest User (Public)</text>
        <text x="75" y="88" fill="#94A3B8" font-size="11">Landing Page Scanner (GET /)</text>
        <text x="75" y="103" fill="#64748B" font-size="10">Ephemeral Scans, No DB Link</text>

        <!-- Node 2: Registered User -->
        <rect x="325" y="42" width="260" height="75" rx="6" fill="#1E293B" stroke="#00F090" stroke-width="1.2"/>
        <circle cx="350" cy="80" r="14" fill="#064E3B"/>
        <text x="350" y="84" text-anchor="middle" fill="#00F090" font-size="13">&#128100;</text>
        <text x="375" y="70" fill="#F8FAFC" font-size="13" font-weight="600">Authenticated User</text>
        <text x="375" y="88" fill="#94A3B8" font-size="11">Dashboard, History &amp; Reports</text>
        <text x="375" y="103" fill="#00F090" font-size="10">Role: 'user' (IDOR Protected)</text>

        <!-- Node 3: Administrator -->
        <rect x="625" y="42" width="260" height="75" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1.2"/>
        <circle cx="650" cy="80" r="14" fill="#312E81"/>
        <text x="650" y="84" text-anchor="middle" fill="#818CF8" font-size="13">&#128273;</text>
        <text x="675" y="70" fill="#F8FAFC" font-size="13" font-weight="600">System Administrator</text>
        <text x="675" y="88" fill="#94A3B8" font-size="11">Admin Console (GET /admin)</text>
        <text x="675" y="103" fill="#818CF8" font-size="10">Audit Logs &amp; User Accounts</text>

        <!-- Node 4: Power BI Desktop -->
        <rect x="925" y="42" width="270" height="75" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
        <circle cx="950" cy="80" r="14" fill="#78350F"/>
        <text x="950" y="84" text-anchor="middle" fill="#F59E0B" font-size="13">&#128202;</text>
        <text x="975" y="70" fill="#F8FAFC" font-size="13" font-weight="600">Power BI Desktop</text>
        <text x="975" y="88" fill="#94A3B8" font-size="11">Threat Intelligence Analytics</text>
        <text x="975" y="103" fill="#F59E0B" font-size="10">Zero-PII CSV &amp; DirectQuery</text>
    </g>

    <!-- Connector: Tier 1 to Tier 2 -->
    <line x1="650" y1="235" x2="650" y2="265" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="660" y="254" fill="#38BDF8" font-size="10" font-weight="600">HTTPS (TLS 1.2+) / AJAX Fetch with CSRF Tokens</text>

    <!-- ==================== TIER 2: EDGE SECURITY & MIDDLEWARE ==================== -->
    <g transform="translate(40, 270)">
        <rect width="1220" height="95" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.2" filter="url(#shadow)"/>
        <rect x="0" y="0" width="1220" height="24" rx="8" fill="#3F1219"/>
        <text x="16" y="17" fill="#F87171" font-size="11" font-weight="700">TIER 2: EDGE SECURITY &amp; HTTP MIDDLEWARE LAYER</text>

        <rect x="25" y="34" width="220" height="50" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="135" y="55" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">CSRF Synchronizer Token</text>
        <text x="135" y="72" text-anchor="middle" fill="#94A3B8" font-size="10">Flask-WTF (Headers &amp; Forms)</text>

        <rect x="265" y="34" width="220" height="50" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="375" y="55" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">HTTP Security Headers</text>
        <text x="375" y="72" text-anchor="middle" fill="#94A3B8" font-size="10">CSP, nosniff, SAMEORIGIN</text>

        <rect x="505" y="34" width="220" height="50" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="615" y="55" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">Payload Boundary Guard</text>
        <text x="615" y="72" text-anchor="middle" fill="#94A3B8" font-size="10">5,000 char cap / 16 MB HTTP</text>

        <rect x="745" y="34" width="220" height="50" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="855" y="55" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">Session Cookie Security</text>
        <text x="855" y="72" text-anchor="middle" fill="#94A3B8" font-size="10">HttpOnly, SameSite=Lax, Secure</text>

        <rect x="985" y="34" width="210" height="50" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="1090" y="55" text-anchor="middle" fill="#F8FAFC" font-size="11" font-weight="600">Error Sanitization</text>
        <text x="1090" y="72" text-anchor="middle" fill="#94A3B8" font-size="10">Generic 400/403/404/500 JSON</text>
    </g>

    <!-- Connector: Tier 2 to Tier 3 -->
    <line x1="650" y1="365" x2="650" y2="395" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="660" y="384" fill="#38BDF8" font-size="10" font-weight="600">Validated Internal WSGI Dispatch</text>

    <!-- ==================== TIER 3: APPLICATION & INTELLIGENCE LAYER ==================== -->
    <g transform="translate(40, 400)">
        <rect width="1220" height="235" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="1220" height="28" rx="8" fill="#1E3A8A"/>
        <text x="16" y="19" fill="#93C5FD" font-size="12" font-weight="700">TIER 3: APPLICATION RUNTIME &amp; CORE INTELLIGENCE LAYER (Python 3.12 / Flask 3.1 / Gunicorn WSGI)</text>

        <!-- Subsystem 1: Core Heuristic Analyzer -->
        <rect x="25" y="42" width="370" height="175" rx="6" fill="#1E293B" stroke="#00F090" stroke-width="1.2"/>
        <rect x="25" y="42" width="370" height="24" rx="6" fill="#064E3B"/>
        <text x="35" y="59" fill="#A7F3D0" font-size="11" font-weight="700">Scam &amp; Threat Heuristic Engine (Phase 1)</text>
        <text x="40" y="85" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; Regex Linguistic Heuristics</text>
        <text x="55" y="100" fill="#94A3B8" font-size="10">Urgency, Payment Pressure, Credentials, Threats, Prizes</text>
        <text x="40" y="120" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; Static URL Structure Inspector</text>
        <text x="55" y="135" fill="#94A3B8" font-size="10">Insecure HTTP, Raw IP, Punycode, Subdomains, Brands</text>
        <text x="40" y="155" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; Multi-Criteria Risk Scoring</text>
        <text x="55" y="170" fill="#94A3B8" font-size="10">Deterministic 0-100 score; Lower / Suspicious / High risk</text>
        <text x="40" y="190" fill="#00F090" font-size="10" font-weight="600">&#10004; In-Memory Analysis (Raw Text Discarded Immediately)</text>

        <!-- Subsystem 2: Auth, RBAC & Core Controllers -->
        <rect x="420" y="42" width="370" height="175" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
        <rect x="420" y="42" width="370" height="24" rx="6" fill="#0C4A6E"/>
        <text x="430" y="59" fill="#BAE6FD" font-size="11" font-weight="700">Authentication &amp; Security Controller (Phase 3)</text>
        <text x="435" y="85" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; Cryptographic Password Hashing</text>
        <text x="450" y="100" fill="#94A3B8" font-size="10">PBKDF2:SHA256 (600,000 rounds) + Dynamic Salt</text>
        <text x="435" y="120" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; Role-Based Access Control (RBAC)</text>
        <text x="450" y="135" fill="#94A3B8" font-size="10">@login_required, @role_required('admin') Decorators</text>
        <text x="435" y="155" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; Horizontal Privacy Isolation</text>
        <text x="450" y="170" fill="#94A3B8" font-size="10">User-scoped queries; Cross-user IDOR defense</text>
        <text x="435" y="190" fill="#38BDF8" font-size="10" font-weight="600">&#10004; Anti-Enumeration Login &amp; Session Fixation Purge</text>

        <!-- Subsystem 3: Modular Cloud & Analytics Services -->
        <rect x="815" y="42" width="380" height="175" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1.2"/>
        <rect x="815" y="42" width="380" height="24" rx="6" fill="#312E81"/>
        <text x="825" y="59" fill="#C7D2FE" font-size="11" font-weight="700">Modular Cloud Services &amp; Analytics (Phase 4)</text>
        <text x="830" y="85" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; blob_storage_service.py</text>
        <text x="845" y="100" fill="#94A3B8" font-size="10">Azure Blob SDK client; Private container; Local fallback</text>
        <text x="830" y="120" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; analytics_service.py</text>
        <text x="845" y="135" fill="#94A3B8" font-size="10">Zero-PII CSV export; KPI &amp; trend aggregators</text>
        <text x="830" y="155" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; config.py &amp; wsgi.py</text>
        <text x="845" y="170" fill="#94A3B8" font-size="10">Development, Production, Testing profiles; Gunicorn spec</text>
        <text x="830" y="190" fill="#818CF8" font-size="10" font-weight="600">&#10004; Credential Masking in Error Logs &amp; Health Probes</text>
    </g>

    <!-- Connector: Tier 3 to Tier 4 -->
    <line x1="650" y1="635" x2="650" y2="665" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="660" y="654" fill="#38BDF8" font-size="10" font-weight="600">Dual-Dialect Parameterized Operations (ACID Transactions)</text>

    <!-- ==================== TIER 4: PERSISTENCE & CLOUD LAYER ==================== -->
    <g transform="translate(40, 670)">
        <rect width="1220" height="180" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="1220" height="28" rx="8" fill="#064E3B"/>
        <text x="16" y="19" fill="#A7F3D0" font-size="12" font-weight="700">TIER 4: PERSISTENCE, CLOUD STORAGE &amp; BUSINESS INTELLIGENCE LAYER</text>

        <!-- Database Block (Dual Mode) -->
        <rect x="25" y="42" width="560" height="122" rx="6" fill="#1E293B" stroke="#00F090" stroke-width="1"/>
        <text x="40" y="63" fill="#00F090" font-size="12" font-weight="700">Dual-Mode Database Layer (DB_MODE = sqlite | azure_sql)</text>
        
        <rect x="38" y="74" width="250" height="78" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="48" y="92" fill="#F8FAFC" font-size="11" font-weight="600">LOCAL MODE: SQLite3</text>
        <text x="48" y="108" fill="#94A3B8" font-size="10">&#9656; File: instance/trustmesh.db</text>
        <text x="48" y="123" fill="#94A3B8" font-size="10">&#9656; 8 Tables, 5 Views, Indexes</text>
        <text x="48" y="138" fill="#00F090" font-size="10">&#10004; Default Zero-Cost Mode</text>

        <rect x="315" y="74" width="255" height="78" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="325" y="92" fill="#38BDF8" font-size="11" font-weight="600">CLOUD MODE: Azure SQL Database</text>
        <text x="325" y="108" fill="#94A3B8" font-size="10">&#9656; Microsoft ODBC Driver 17/18</text>
        <text x="325" y="123" fill="#94A3B8" font-size="10">&#9656; 28 T-SQL Batches, Encrypted</text>
        <text x="325" y="138" fill="#38BDF8" font-size="10">&#10004; Enterprise Cloud Scale</text>

        <!-- Report Storage Block (Dual Mode) -->
        <rect x="615" y="42" width="280" height="122" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
        <text x="630" y="63" fill="#818CF8" font-size="12" font-weight="700">Forensic Report Storage</text>
        <text x="630" y="85" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; Azure Blob Storage</text>
        <text x="645" y="100" fill="#94A3B8" font-size="10">Private container 'trustmesh-reports'</text>
        <text x="630" y="120" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; Local JSON Storage Fallback</text>
        <text x="645" y="135" fill="#94A3B8" font-size="10">Instance reports cache (Zero-Cost)</text>
        <text x="630" y="152" fill="#818CF8" font-size="10" font-weight="600">&#10004; Path Traversal Guarded</text>

        <!-- Analytics Output Block -->
        <rect x="915" y="42" width="280" height="122" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
        <text x="930" y="63" fill="#F59E0B" font-size="12" font-weight="700">Analytics Data Mart</text>
        <text x="930" y="85" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; 4 Analytical Views</text>
        <text x="945" y="100" fill="#94A3B8" font-size="10">Overview, Distribution, Signals, Trends</text>
        <text x="930" y="120" fill="#F8FAFC" font-size="11" font-weight="600">&#9656; Anonymized CSV Pipeline</text>
        <text x="945" y="135" fill="#94A3B8" font-size="10">100% PII-Free Threat Telemetry</text>
        <text x="930" y="152" fill="#F59E0B" font-size="10" font-weight="600">&#10004; Power BI Desktop Ingestion</text>
    </g>
</svg>